# Render blueprint: deploys storestack as a free Python web service.
# The app auto-seeds sample data on first boot (ephemeral filesystem),
# so the public demo is usable immediately.
services:
  - type: web
    name: storestack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: STORESTACK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
