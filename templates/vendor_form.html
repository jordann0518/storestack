{% extends "base.html" %}
{% block title %}{{ 'Edit' if vendor else 'Add' }} vendor &mdash; storestack{% endblock %}
{% block content %}
<h1>{{ 'Edit vendor' if vendor else 'Add vendor' }}</h1>

<div class="card">
  <form method="post">
    <div class="field">
      <label for="name">Vendor name</label>
      <input id="name" name="name" required value="{{ form.get('name', '') }}">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="contact">Contact person</label>
        <input id="contact" name="contact" value="{{ form.get('contact', '') }}">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" value="{{ form.get('phone', '') }}">
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ form.get('email', '') }}">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="3">{{ form.get('notes', '') }}</textarea>
    </div>
    <button class="btn" type="submit">Save vendor</button>
    <a class="btn secondary" href="{{ url_for('vendors') }}">Cancel</a>
  </form>
</div>
{% endblock %}
